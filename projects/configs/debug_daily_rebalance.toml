# Debug configuration for daily rebalance strategy
# Fast iteration with small dataset and verbose logging

[datasource]
type = "taobao_daily"
data_dir = "/Users/rachelpeter/codebase/ocelot/data/raw_taobao"
start = "2020-01-01"
end = "2020-01-31"
exclude_halted = true
exclude_st = true
# Limit to first N instruments for faster iteration (0 = no limit)
max_instruments = 3

[venue]
# Venues are auto-detected from instruments; these settings apply to all
oms_type = "NETTING"
account_type = "CASH"
base_currency = "CNY"
starting_balance = 1_000_000

[strategy]
type = "daily_rebalance"
random_seed = 42
max_position_pct = 0.05
order_lot_size = 100
long_only = true

[engine]
trader_id = "BACKTESTER-DEBUG-001"
log_level = "DEBUG"
bypass_risk = true
