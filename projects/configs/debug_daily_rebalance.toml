# Debug configuration — small dataset, verbose logging
# Uses Actor + Strategy architecture

[datasource]
type = "duckdb_daily"
db_path = "/Users/rachelpeter/codebase/ocelot/data/china_daily.duckdb"
start = "2020-01-01"
end = "2020-01-31"
exclude_halted = true
exclude_st = true
max_instruments = 3

[venue]
oms_type = "NETTING"
account_type = "CASH"
base_currency = "CNY"
starting_balance = 1_000_000

[signal]
random_seed = 42
long_only = true

[execution]
max_position_pct = 0.05
order_lot_size = 100

[risk]
enabled = true
stop_loss_pct = 0.10
take_profit_pct = 0.20

[engine]
trader_id = "BACKTESTER-DEBUG-001"
log_level = "DEBUG"
bypass_risk = true
