# Backtest configuration — Actor + Strategy architecture
#
# SignalActor  → computes alpha, publishes RebalanceSignal
# RiskActor    → monitors positions, publishes RiskSignal
# ExecutionStrategy → subscribes to both, executes orders

[datasource]
type = "duckdb_daily"
db_path = "/Users/rachelpeter/codebase/ocelot/data/china_daily.duckdb"
start = "2020-01-01"
end = "2020-06-30"
exclude_halted = true
exclude_st = true
# Limit to first N instruments for faster iteration (0 = no limit)
max_instruments = 50

[venue]
oms_type = "NETTING"
account_type = "CASH"
base_currency = "CNY"
starting_balance = 10_000_000

[signal]
random_seed = 42
long_only = true

[execution]
max_position_pct = 0.02
order_lot_size = 100

[risk]
enabled = true
stop_loss_pct = 0.10
take_profit_pct = 0.20
action_on_stop_loss = "CLOSE"
action_on_take_profit = "CLOSE"

[engine]
trader_id = "BACKTESTER-001"
log_level = "INFO"
bypass_risk = true
